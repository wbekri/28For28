<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Noto+Sans+JP:wght@200;300&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #23241c; }
  a { color: #7d1f22; }
  a:hover { color: #a83338; }
  @keyframes flipFwd { from { transform: rotateY(0deg); } to { transform: rotateY(-172deg); } }
  @keyframes flipBack { from { transform: rotateY(0deg); } to { transform: rotateY(172deg); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: {{ shellPad }}; background: radial-gradient(120% 90% at 50% 0%, #3a3b2c 0%, #23241c 60%, #191a14 100%); font-family: 'Courier Prime', monospace;">
  <div style="position: relative; width: 100%; max-width: 1420px;">

    <div style="position: relative; padding: {{ coverPad }}; border-radius: 6px 14px 14px 6px; background: linear-gradient(150deg, #8b2427 0%, #6f1c1f 55%, #571518 100%); box-shadow: 0 60px 90px -30px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.4) inset;">
      <div style="display: grid; grid-template-columns: {{ gridCols }}; perspective: 2400px; background: #e9e7ce; border-radius: 3px; box-shadow: 0 2px 0 rgba(0,0,0,.25);">

        <div style="position: relative; min-width: 0; box-sizing: border-box; padding: {{ pagePad }}; min-height: {{ pageMinH }}; display: flex; flex-direction: column; background: linear-gradient(95deg, #dcd9bd 0%, #eceacf 12%, #edebd2 88%, #e3e0c4 100%); box-shadow: inset -22px 0 34px -26px rgba(60,50,20,.55);">
          <div style="font-size: {{ kickerSize }}; letter-spacing: .28em; text-transform: uppercase; color: #8a7f5c;">{{ kicker }}</div>
          <h1 style="margin: 16px 0 0; font-family: 'Jost', sans-serif; font-weight: 300; font-size: {{ titleSize }}; line-height: 1.08; letter-spacing: .14em; color: #34342b; text-wrap: balance;">{{ title }}</h1>
          <div style="display: flex; align-items: center; gap: 14px; margin-top: 14px;">
            <span style="display: block; width: 8px; height: 8px; border-radius: 50%; background: #9fb7c9;"></span>
            <span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 300; font-size: {{ jpSize }}; letter-spacing: .22em; color: #6d6a52;">{{ jp }}</span>
            <span style="display: block; width: 8px; height: 8px; border-radius: 50%; background: #e2a8bb;"></span>
          </div>
          <div style="margin: 28px 0 24px; height: 1px; background: linear-gradient(90deg, rgba(120,110,70,.5), rgba(120,110,70,0));"></div>
          <div style="display: flex; flex-direction: column; gap: {{ gapMain }}; font-size: {{ bodySize }}; line-height: 1.72; color: #3d3b30; white-space: pre-line; text-wrap: pretty;">
            <sc-for list="{{ lines }}" as="line" hint-placeholder-count="4">
              <div>{{ line }}</div>
            </sc-for>
          </div>
          <div style="margin-top: auto; padding-top: 34px; display: flex; align-items: baseline; justify-content: space-between; gap: 20px; font-size: {{ sigSize }}; letter-spacing: .18em; color: #8a7f5c;">
            <span>{{ signature }}</span>
            <span>{{ pageLabel }}</span>
          </div>
        </div>

        <div style="position: relative; min-width: 0; box-sizing: border-box; padding: {{ pagePadR }}; min-height: {{ pageMinH }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: {{ gapMain }}; background: linear-gradient(85deg, #e3e0c4 0%, #edebd2 12%, #eceacf 88%, #dcd9bd 100%); box-shadow: inset 22px 0 34px -26px rgba(60,50,20,.55);">
          <sc-if value="{{ hasImg }}" hint-placeholder-val="{{ true }}">
            <div style="position: relative; display: block; width: 100%; max-width: min(100%, {{ imgW }}); box-sizing: border-box; padding: {{ framePad }}; background: #fbfaf4; box-shadow: 0 22px 40px -18px rgba(50,40,15,.55), 0 0 0 1px rgba(0,0,0,.06); transform: rotate(-1.2deg);">
              <div style="position: absolute; top: -14px; left: 50%; width: 92px; height: 26px; margin-left: -46px; background: rgba(224,214,168,.72); box-shadow: 0 1px 2px rgba(0,0,0,.12); transform: rotate(-2deg);"></div>
              <div role="img" aria-label="{{ caption }}" style="width: 100%; aspect-ratio: {{ imgAspect }}; background-image: url('{{ img }}'); background-size: contain; background-position: center; background-repeat: no-repeat; filter: {{ imgFilter }}; animation: fadeUp .5s ease both;"></div>
            </div>
          </sc-if>
          <sc-if value="{{ hasVideo }}" hint-placeholder-val="{{ false }}">
            <div style="position: relative; display: block; width: 100%; max-width: min(100%, {{ imgW }}); box-sizing: border-box; padding: {{ framePad }}; background: #fbfaf4; box-shadow: 0 22px 40px -18px rgba(50,40,15,.55), 0 0 0 1px rgba(0,0,0,.06); transform: rotate(-1.2deg);">
              <div style="position: absolute; top: -14px; left: 50%; width: 92px; height: 26px; margin-left: -46px; background: rgba(224,214,168,.72); box-shadow: 0 1px 2px rgba(0,0,0,.12); transform: rotate(-2deg);"></div>
              <video ref="{{ videoRef }}" src="{{ videoSrc }}" controls="{{ true }}" loop="{{ true }}" muted="{{ true }}" preload="metadata" playsInline="{{ true }}" style="display: block; width: 100%; aspect-ratio: {{ imgAspect }}; object-fit: contain; background: #14150f; filter: {{ imgFilter }};"></video>
            </div>
          </sc-if>
          <sc-if value="{{ noImg }}" hint-placeholder-val="{{ false }}">
            <div style="display: block; width: 100%; max-width: min(100%, 420px); box-sizing: border-box; padding: 16px; background: rgba(251,250,244,.55); box-shadow: 0 18px 34px -22px rgba(50,40,15,.4); transform: rotate(-1deg);">
              <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; width: 100%; aspect-ratio: 3 / 4; box-sizing: border-box; padding: 24px; border: 1px dashed rgba(120,110,70,.55); background-image: repeating-linear-gradient(45deg, rgba(120,110,70,.05) 0 8px, rgba(120,110,70,0) 8px 16px);">
                <div style="font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: #8a7f5c;">photo à venir</div>
                <div style="font-size: 14px; line-height: 1.6; text-align: center; color: #6d6a52; white-space: pre-line;">{{ imgHint }}</div>
                <div style="font-size: 11px; letter-spacing: .12em; color: #9a9075;">drop it here later</div>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ hasTable }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: min(100%, 460px);">
              <div style="display: flex; flex-direction: column; gap: 14px; font-size: {{ bodySize }}; line-height: 1.7; color: #3d3b30; white-space: pre-line; text-wrap: pretty;">
                <sc-for list="{{ rightLines }}" as="rline" hint-placeholder-count="2">
                  <div>{{ rline }}</div>
                </sc-for>
              </div>
              <div style="display: block; width: 100%; box-sizing: border-box; padding: {{ tablePad }}; background: #fbfaf4; box-shadow: 0 22px 40px -18px rgba(50,40,15,.55), 0 0 0 1px rgba(0,0,0,.06); transform: rotate(-.8deg);">
              <div style="display: grid; grid-template-columns: 1.2fr .9fr .9fr; gap: 10px 12px; align-items: center; font-size: {{ capSize }}; color: #3d3b30;">
                <div style="font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: #8a7f5c;">critère</div>
                <div style="font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #7d1f22; text-align: center;">Coach</div>
                <div style="font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #8a7f5c; text-align: center;">Pinko</div>
                <sc-for list="{{ tableRows }}" as="row" hint-placeholder-count="6">
                  <div style="border-top: 1px solid rgba(120,110,70,.22); padding-top: 8px;">{{ row.k }}</div>
                  <div style="border-top: 1px solid rgba(120,110,70,.22); padding-top: 8px; text-align: center; letter-spacing: .08em; color: #7d1f22;">{{ row.a }}</div>
                  <div style="border-top: 1px solid rgba(120,110,70,.22); padding-top: 8px; text-align: center; letter-spacing: .08em; color: #6d6a52;">{{ row.b }}</div>
                </sc-for>
              </div>
              <div style="margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(120,110,70,.35); display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
                <span style="font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #8a7f5c;">mon choix</span>
                <span style="font-family: 'Jost', sans-serif; font-weight: 300; font-size: 22px; letter-spacing: .16em; color: #7d1f22;">COACH</span>
              </div>
            </div>
            </div>
          </sc-if>
          <div style="font-size: {{ capSize }}; letter-spacing: .06em; color: #6d6a52; text-align: center; max-width: 82%;">{{ caption }}</div>
        </div>

        <sc-if value="{{ flipFwd }}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; top: 0; right: 0; width: 50%; height: 100%; transform-origin: left center; transform-style: preserve-3d; animation: flipFwd .62s cubic-bezier(.4,.05,.6,1) forwards; background: linear-gradient(85deg, #e6e3c8, #edebd2 40%, #dcd9bd); box-shadow: -14px 0 40px -10px rgba(0,0,0,.35); pointer-events: none;"></div>
        </sc-if>
        <sc-if value="{{ flipBack }}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; top: 0; left: 0; width: 50%; height: 100%; transform-origin: right center; transform-style: preserve-3d; animation: flipBack .62s cubic-bezier(.4,.05,.6,1) forwards; background: linear-gradient(95deg, #dcd9bd, #edebd2 60%, #e6e3c8); box-shadow: 14px 0 40px -10px rgba(0,0,0,.35); pointer-events: none;"></div>
        </sc-if>

        <div style="position: absolute; top: 0; bottom: 0; left: 50%; width: 44px; margin-left: -22px; pointer-events: none; display: {{ gutterDisp }}; background: linear-gradient(90deg, rgba(90,75,35,0) 0%, rgba(90,75,35,.22) 45%, rgba(90,75,35,.3) 50%, rgba(90,75,35,.22) 55%, rgba(90,75,35,0) 100%);"></div>
      </div>
    </div>

    <button type="button" onClick="{{ prev }}" aria-label="Previous page" style="position: absolute; top: 50%; left: 6px; margin-top: -26px; width: {{ navSize }}; height: {{ navSize }}; border: none; border-radius: 50%; background: rgba(248,246,238,.9); color: #4a4738; font-size: 20px; cursor: pointer; box-shadow: 0 10px 24px -8px rgba(0,0,0,.5); display: grid; place-items: center;" style-hover="background: #fffdf6; transform: scale(1.06);">‹</button>
    <button type="button" onClick="{{ next }}" aria-label="Next page" style="position: absolute; top: 50%; right: 6px; margin-top: -26px; width: {{ navSize }}; height: {{ navSize }}; border: none; border-radius: 50%; background: rgba(248,246,238,.9); color: #4a4738; font-size: 20px; cursor: pointer; box-shadow: 0 10px 24px -8px rgba(0,0,0,.5); display: grid; place-items: center;" style-hover="background: #fffdf6; transform: scale(1.06);">›</button>

    <div style="margin-top: 26px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px;">
      <sc-for list="{{ dots }}" as="dot" hint-placeholder-count="17">
        <button type="button" onClick="{{ dot.go }}" aria-label="{{ dot.label }}" style="width: 9px; height: 9px; padding: 0; border: none; border-radius: 50%; cursor: pointer; background: {{ dot.bg }};"></button>
      </sc-for>
    </div>
    <div style="margin-top: 14px; text-align: center; font-size: 11.5px; letter-spacing: .3em; text-transform: uppercase; color: #7d7b63;">← → to turn the page</div>
  </div>
</div>

class Component extends DCLogic {
  state = { i: 0, flip: 0, narrow: typeof window !== "undefined" && window.innerWidth < 860 };
  vref = React.createRef();

  resolve(p) {
    if (!p) return "";
    if (p.slice(0, 5) === "data:" || p.slice(0, 5) === "blob:") return p;
    if (!this._vault) {
      this._vault = {};
      const els = document.querySelectorAll("#asset-vault [data-key]");
      for (let i = 0; i < els.length; i++) {
        const k = els[i].getAttribute("data-key");
        const s = els[i].getAttribute("src") || "";
        if (k && s.slice(0, 5) === "data:") this._vault[k] = s;
      }
    }
    return this._vault[p] || p;
  }

  syncVideo() {
    const el = this.vref.current;
    const src = this.resolve(SPREADS[this.state.i].video);
    if (!el || !src) return;
    if (el.getAttribute("data-src") !== src) {
      el.setAttribute("data-src", src);
      el.src = src;
      el.load();
    }
  }

  componentDidUpdate() { this.syncVideo(); }

  componentDidMount() {
    this.syncVideo();
    try {
      const saved = parseInt(localStorage.getItem("ww-book-spread") || "0", 10);
      if (!isNaN(saved) && saved > 0 && saved < SPREADS.length) this.setState({ i: saved });
    } catch (e) {}
    this._key = (e) => {
      if (e.key === "ArrowRight") this.go(this.state.i + 1, 1);
      if (e.key === "ArrowLeft") this.go(this.state.i - 1, -1);
    };
    window.addEventListener("keydown", this._key);
    this._resize = () => {
      const n = window.innerWidth < 860;
      if (n !== this.state.narrow) this.setState({ narrow: n });
    };
    window.addEventListener("resize", this._resize);
    this._resize();
    this._touch = { x: 0, y: 0 };
    this._ts = (e) => { const t = e.touches[0]; this._touch = { x: t.clientX, y: t.clientY }; };
    this._te = (e) => {
      const t = e.changedTouches[0];
      const dx = t.clientX - this._touch.x, dy = t.clientY - this._touch.y;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) this.go(this.state.i + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
    };
    window.addEventListener("touchstart", this._ts, { passive: true });
    window.addEventListener("touchend", this._te, { passive: true });
  }

  componentWillUnmount() {
    window.removeEventListener("keydown", this._key);
    window.removeEventListener("resize", this._resize);
    window.removeEventListener("touchstart", this._ts);
    window.removeEventListener("touchend", this._te);
    clearTimeout(this._t);
  }

  go(n, dir) {
    if (n < 0 || n > SPREADS.length - 1 || n === this.state.i) return;
    const d = dir || (n > this.state.i ? 1 : -1);
    this.setState({ i: n, flip: d });
    try { localStorage.setItem("ww-book-spread", String(n)); } catch (e) {}
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ flip: 0 }), 640);
  }

  renderVals() {
    const i = this.state.i;
    const s = SPREADS[i];
    const tint = this.props.photoTint ?? 0.12;
    const nar = this.state.narrow;
    return {
      gridCols: "1fr 1fr",
      pagePad: nar ? "22px 16px 16px 18px" : "62px 58px 46px 66px",
      pagePadR: nar ? "22px 18px 20px 16px" : "62px 58px 46px",
      pageMinH: nar ? "420px" : "700px",
      coverPad: nar ? "10px 10px 14px" : "30px 34px 38px",
      titleSize: nar ? "17px" : "46px",
      navSize: nar ? "34px" : "52px",
      shellPad: nar ? "10px 6px 22px" : "40px 20px",
      gutterDisp: "block",
      bodySize: nar ? "9.5px" : "15.5px",
      kickerSize: nar ? "7.5px" : "11px",
      capSize: nar ? "8px" : "13.5px",
      jpSize: nar ? "9px" : "14px",
      sigSize: nar ? "9px" : "13px",
      gapMain: nar ? "12px" : "26px",
      framePad: nar ? "6px" : "14px",
      tablePad: nar ? "12px 12px" : "22px 24px",
      kicker: s.kicker,
      title: s.title,
      jp: (this.props.showJapanese ?? true) ? s.jp : "",
      lines: s.lines,
      img: this.resolve(s.img) || "",
      hasImg: !!s.img && !s.video,
      hasVideo: !!s.video,
      videoSrc: this.resolve(s.video) || "",
      videoRef: this.vref,
      noImg: !s.img && !s.video && !s.table,
      hasTable: !!s.table,
      tableRows: s.table || [],
      rightLines: s.rightLines || [],
      imgHint: s.imgHint || "",
      caption: s.caption || "",
      signature: s.signature,
      pageLabel: String(i + 1).padStart(2, "0") + " / " + String(SPREADS.length).padStart(2, "0"),
      imgW: s.w || (s.wide ? "660px" : "400px"),
      imgAspect: s.aspect || (s.wide ? "16 / 9" : "3 / 4"),
      imgFilter: "sepia(" + tint + ") saturate(" + (1 - tint * 0.3) + ") contrast(1.02)",
      flipFwd: this.state.flip === 1,
      flipBack: this.state.flip === -1,
      next: () => this.go(i + 1, 1),
      prev: () => this.go(i - 1, -1),
      dots: SPREADS.map((sp, n) => ({
        label: sp.title,
        bg: n === i ? "#f2efe0" : "rgba(242,239,224,.32)",
        go: () => this.go(n)
      }))
    };
  }
}
